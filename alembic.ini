# Alembic configuration for ARK.
#
# Migrations are normally applied programmatically (ark.db.run_migrations),
# which builds the config in memory — this file exists for manual CLI use:
#   ARK_HOME=/opt .venv/bin/python -m alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# NOTE: no [loggers]/[handlers]/[formatters] sections on purpose — alembic's
# template env.py would call logging.fileConfig() and clobber ARK's structured
# logging. ARK's own env.py does not reconfigure logging.
